name: Bug report
description: Something in the library does not behave as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >
        What did you observe, and what did you expect instead? For a wording
        problem, give the exact input and the exact output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest snippet that shows the problem.
      render: typescript
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 3.0.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: 22.11.0
    validations:
      required: true
